<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Wallpaper - Mobile Wallpapers</title>
  <meta name="description" content="Discover premium mobile phone wallpapers. Explore Islamic, Nature, Aesthetic and more 9:16 wallpapers.">
  <meta name="google-site-verification" content="e2RrqWDlKxHOPt0hT0SbW2dvhjsUgITfsuQwy6ZZhjY" />
  <link rel="canonical" href="https://apna-wallpapers-a3pf.vercel.app/" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Apna Wallpaper - Mobile Wallpapers">
  <meta property="og:description" content="Discover premium mobile phone wallpapers. Explore 9:16 wallpapers for your device.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://apna-wallpapers-a3pf.vercel.app/" />
  <meta property="og:image" content="https://apna-wallpapers-a3pf.vercel.app/apna-wallpaper-logo-512.png" />
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/apna-wallpaper-logo-512.png" />
  <link rel="apple-touch-icon" href="/apna-wallpaper-logo-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0B0B0B;
      --card: #1A1A1A;
      --border: #2A2A2A;
      --gold: #C9A227;
      --gold-hover: #b8921e;
      --white: #FFFFFF;
      --gray: #A0A0A0;
      --radius: 12px;
      --header-h: 66px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-h);
      z-index: 100;
      background: rgba(11, 11, 11, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--white);
    }

    .brand-logo {
      display: block;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .header-upload-btn {
      background: var(--gold);
      color: #0B0B0B;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .header-upload-btn:hover {
      background: var(--gold-hover);
    }

    /* CONTROLS (SEARCH & CATEGORIES) */
    .controls-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(var(--header-h) + 16px) 16px 12px;
    }

    .search-box {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--white);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--gold);
    }

    .categories {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex-shrink: 0;
      background: var(--card);
      color: var(--gray);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .category-btn.active {
      background: var(--gold);
      color: #0B0B0B;
      border-color: var(--gold);
      font-weight: 600;
    }

    /* MAIN CONTAINER */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 48px;
      flex: 1;
    }

    /* WALLPAPER GRID */
    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (min-width: 600px) {
      .wallpaper-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
    }

    @media (min-width: 950px) {
      .wallpaper-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
    }

    .wallpaper-card {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .wallpaper-card:focus-visible {
      border-color: var(--gold);
    }

    .wallpaper-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .wallpaper-card:hover img {
      transform: scale(1.03);
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 16px;
      color: var(--gray);
      font-size: 15px;
    }

    /* LOAD MORE */
    .load-more-container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .load-more-btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      background: var(--gold);
      color: #0B0B0B;
    }

    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* PREVIEW OVERLAY */
    .preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .preview-overlay.show {
      display: flex;
    }

    .preview-modal {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-media-container {
      position: relative;
      width: 100%;
      height: min(62vh, 600px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-image {
      max-width: 100%;
      max-height: 100%;
      height: 100%;
      width: auto;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    .preview-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(26, 26, 26, 0.85);
      color: var(--white);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, border-color 0.2s;
      z-index: 5;
    }

    .preview-arrow:hover {
      background: #252525;
      border-color: var(--gold);
    }

    .preview-arrow-prev { left: 6px; }
    .preview-arrow-next { right: 6px; }

    .preview-meta {
      margin-top: 14px;
      width: 100%;
    }

    .preview-category {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .preview-title {
      color: var(--white);
      font-size: 18px;
      font-weight: 600;
    }

    .preview-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
    }

    .preview-download-btn, .preview-report-btn {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .preview-download-btn {
      background: var(--gold);
      color: #0B0B0B;
      border: none;
    }
    .preview-download-btn:hover { background: var(--gold-hover); }

    .preview-report-btn {
      background: var(--card);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }
    .preview-report-btn:hover { background: rgba(255, 107, 107, 0.1); }

    .preview-close-btn {
      width: 100%;
      margin-top: 10px;
      background: var(--card);
      color: var(--white);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .preview-close-btn:hover { background: #252525; }

    .preview-help {
      margin-top: 12px;
      color: var(--gray);
      font-size: 11px;
      line-height: 1.5;
    }

    /* REPORT OVERLAY */
    .report-modal {
      position: absolute;
      inset: 0;
      background: rgba(11, 11, 11, 0.96);
      border-radius: var(--radius);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 15;
      text-align: center;
    }
    .report-modal.show { display: flex; }
    .report-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--white);
    }
    .report-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }
    .report-option-btn {
      background: var(--card);
      color: var(--white);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .report-option-btn:hover {
      border-color: var(--gold);
      background: #252525;
    }
    .report-cancel-btn {
      background: transparent;
      color: var(--gray);
      border: none;
      font-size: 13px;
      padding: 8px;
    }
    .report-cancel-btn:hover { color: var(--white); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--card);
      color: var(--white);
      border: 1px solid var(--gold);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* FOOTER */
    .footer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      margin-top: auto;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--gray);
      font-size: 12px;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .footer-inner {
        flex-direction: column;
        text-align: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/index.html" class="brand" aria-label="Apna Wallpaper Home">
        <img src="/apna-wallpaper-logo-512.png" alt="Apna Wallpaper logo" width="34" height="34" class="brand-logo" />
        <span class="brand-name">Apna Wallpaper</span>
      </a>
      <a href="/upload.html" class="header-upload-btn">Upload</a>
    </div>
  </header>

  <div class="controls-container">
    <input type="text" id="search-box" class="search-box" placeholder="Search wallpapers by title or category..." aria-label="Search wallpapers">
    <nav class="categories" id="categories-container" aria-label="Wallpaper categories"></nav>
  </div>

  <main class="container">
    <section class="wallpaper-grid" id="wallpaper-grid" aria-live="polite"></section>
    <div class="load-more-container" id="load-more-container" style="display: none;">
      <button class="load-more-btn" id="load-more-btn">Load more</button>
    </div>
  </main>

  <div class="preview-overlay" id="preview-overlay" role="dialog" aria-modal="true" aria-label="Wallpaper Preview">
    <div class="preview-modal" id="preview-modal">
      <div class="preview-media-container">
        <img id="preview-image" class="preview-image" src="" alt="Wallpaper preview">
        <button class="preview-arrow preview-arrow-prev" id="preview-prev" aria-label="Previous wallpaper">&#8249;</button>
        <button class="preview-arrow preview-arrow-next" id="preview-next" aria-label="Next wallpaper">&#8250;</button>
      </div>

      <div class="preview-meta">
        <div class="preview-category" id="preview-category"></div>
        <h2 class="preview-title" id="preview-title"></h2>
      </div>

      <div class="preview-actions">
        <button class="preview-download-btn" id="preview-download">Download</button>
        <button class="preview-report-btn" id="preview-report">Report</button>
      </div>
      <button class="preview-close-btn" id="close-preview">Close</button>
      <p class="preview-help">How to set on phone: open the image, tap Save, then set it as wallpaper from your phone settings.</p>

      <div class="report-modal" id="report-modal">
        <h3 class="report-title">Report Wallpaper</h3>
        <div class="report-options">
          <button class="report-option-btn" data-reason="Wrong image">Wrong image</button>
          <button class="report-option-btn" data-reason="Not a wallpaper">Not a wallpaper</button>
          <button class="report-option-btn" data-reason="Inappropriate content">Inappropriate content</button>
          <button class="report-option-btn" data-reason="Other">Other</button>
        </div>
        <button class="report-cancel-btn" id="report-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Wallpaper uploaded</div>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 Apna Wallpaper</span>
      <span>All rights reserved.</span>
    </div>
  </footer>

  <script>
    // =========================================================================
    // 1. SUPABASE CLIENT & CATEGORIES ARRAY
    // =========================================================================
    const supabaseUrl = 'https://klhysrbbbvlmzwdycuky.supabase.co';
    const supabaseKey = 'sb_publishable_AoXsUMgxJi8a98qlL-N-NA_eeQTcOI3';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const CATEGORIES = ["All", "Islamic", "Nature", "Aesthetic", "Minimal", "Abstract", "Dark", "Cars", "Space", "Flowers"];

    let activeCategory = "All";
    let searchQuery = "";
    let previewIndex = 0;
    let wallpapers = [];
    let displayedCount = 60;
    const PAGE_SIZE = 60;

    // =========================================================================
    // 2. RENDER CATEGORIES
    // =========================================================================
    const categoriesContainer = document.getElementById("categories-container");
    function renderCategories() {
      categoriesContainer.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "category-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          displayedCount = PAGE_SIZE;
          renderCategories();
          renderWallpapers();
        });
        categoriesContainer.appendChild(btn);
      });
    }

    // =========================================================================
    // 3. LOAD WALLPAPERS
    // =========================================================================
    const wallpaperGrid = document.getElementById("wallpaper-grid");
    const loadMoreContainer = document.getElementById("load-more-container");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const searchBox = document.getElementById("search-box");

    searchBox.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      displayedCount = PAGE_SIZE;
      renderWallpapers();
    });

    async function loadWallpapers() {
      try {
        const { data, error } = await supabaseClient
          .from('wallpapers')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        wallpapers = (data || []).map(row => ({
          id: row.id,
          title: row.title,
          category: row.category,
          image: row.image_url
        }));
      } catch (err) {
        console.error("Error loading wallpapers:", err);
        wallpapers = [];
      }
      renderWallpapers();
    }

    function getFilteredWallpapers() {
      let result = wallpapers;
      if (activeCategory !== "All") {
        result = result.filter(item => item.category === activeCategory);
      }
      if (searchQuery) {
        result = result.filter(item => 
          item.title.toLowerCase().includes(searchQuery) || 
          item.category.toLowerCase().includes(searchQuery)
        );
      }
      return result;
    }

    function renderWallpapers() {
      wallpaperGrid.innerHTML = "";
      const filtered = getFilteredWallpapers();

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = searchQuery ? "No wallpapers found for this search." : "No wallpapers found in this category.";
        wallpaperGrid.appendChild(empty);
        loadMoreContainer.style.display = "none";
        return;
      }

      const paginatedList = filtered.slice(0, displayedCount);

      paginatedList.forEach(wallpaper => {
        const card = document.createElement("article");
        card.className = "wallpaper-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", "View " + wallpaper.title);

        const img = document.createElement("img");
        img.src = wallpaper.image;
        img.alt = wallpaper.title;
        img.loading = "lazy";
        img.decoding = "async";
        img.onerror = function() {
          this.style.opacity = "0.3";
        };

        card.appendChild(img);
        card.addEventListener("click", () => openPreviewById(wallpaper.id));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openPreviewById(wallpaper.id);
          }
        });
        wallpaperGrid.appendChild(card);
      });

      if (filtered.length > displayedCount) {
        loadMoreContainer.style.display = "flex";
      } else {
        loadMoreContainer.style.display = "none";
      }
    }

    loadMoreBtn.addEventListener("click", () => {
      displayedCount += PAGE_SIZE;
      renderWallpapers();
    });

    // =========================================================================
    // 4. PREVIEW MODAL & NAVIGATION
    // =========================================================================
    const previewOverlay = document.getElementById("preview-overlay");
    const previewImage = document.getElementById("preview-image");
    const previewCategory = document.getElementById("preview-category");
    const previewTitle = document.getElementById("preview-title");
    const previewCloseBtn = document.getElementById("close-preview");
    const previewPrevBtn = document.getElementById("preview-prev");
    const previewNextBtn = document.getElementById("preview-next");
    const previewDownloadBtn = document.getElementById("preview-download");
    const previewReportBtn = document.getElementById("preview-report");
    const reportModal = document.getElementById("report-modal");
    const reportCancelBtn = document.getElementById("report-cancel");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function openPreviewById(id) {
      const currentList = getFilteredWallpapers();
      previewIndex = currentList.findIndex(item => item.id === id);
      if (previewIndex === -1) return;
      updatePreviewContent();
      previewOverlay.classList.add("show");
      document.body.style.overflow = "hidden";
      reportModal.classList.remove("show");
    }

    function updatePreviewContent() {
      const currentList = getFilteredWallpapers();
      if (previewIndex < 0 || previewIndex >= currentList.length) return;
      const current = currentList[previewIndex];
      previewImage.src = current.image;
      previewImage.alt = current.title;
      previewCategory.textContent = current.category;
      previewTitle.textContent = current.title;
    }

    function closePreview() {
      previewOverlay.classList.remove("show");
      reportModal.classList.remove("show");
      document.body.style.overflow = "";
    }

    function navigatePreview(direction) {
      const currentList = getFilteredWallpapers();
      if (!currentList.length) return;
      previewIndex = (previewIndex + direction + currentList.length) % currentList.length;
      updatePreviewContent();
      reportModal.classList.remove("show");
    }

    previewCloseBtn.addEventListener("click", closePreview);
    previewPrevBtn.addEventListener("click", () => navigatePreview(-1));
    previewNextBtn.addEventListener("click", () => navigatePreview(1));

    previewOverlay.addEventListener("click", (e) => {
      if (e.target === previewOverlay) {
        closePreview();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!previewOverlay.classList.contains("show")) return;
      if (e.key === "Escape") {
        if (reportModal.classList.contains("show")) {
          reportModal.classList.remove("show");
        } else {
          closePreview();
        }
      } else if (e.key === "ArrowLeft") {
        navigatePreview(-1);
      } else if (e.key === "ArrowRight") {
        navigatePreview(1);
      }
    });

    // Touch swipe handling
    let touchStartX = 0;
    let touchStartY = 0;

    previewOverlay.addEventListener("touchstart", (e) => {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    previewOverlay.addEventListener("touchend", (e) => {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          navigatePreview(1);
        } else {
          navigatePreview(-1);
        }
      }
    }, { passive: true });

    // =========================================================================
    // 5. DOWNLOAD HANDLER
    // =========================================================================
    previewDownloadBtn.addEventListener("click", async () => {
      const currentList = getFilteredWallpapers();
      const current = currentList[previewIndex];
      if (!current) return;

      const rawTitle = current.title || "wallpaper";
      const cleanName = rawTitle.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "wallpaper";

      try {
        const response = await fetch(current.image, { mode: "cors" });
        if (!response.ok) throw new Error("Image fetch failed");
        const blob = await response.blob();

        let ext = "jpg";
        if (blob.type.includes("png")) ext = "png";
        else if (blob.type.includes("webp")) ext = "webp";
        else if (blob.type.includes("jpeg") || blob.type.includes("jpg")) ext = "jpg";

        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = `${cleanName}.${ext}`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
      } catch (err) {
        window.open(current.image, "_blank", "noopener,noreferrer");
      }
    });

    // =========================================================================
    // 6. REPORT HANDLER
    // =========================================================================
    previewReportBtn.addEventListener("click", () => {
      reportModal.classList.add("show");
    });

    reportCancelBtn.addEventListener("click", () => {
      reportModal.classList.remove("show");
    });

    document.querySelectorAll(".report-option-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const reason = btn.getAttribute("data-reason");
        const currentList = getFilteredWallpapers();
        const current = currentList[previewIndex];
        if (!current) return;

        try {
          const { error } = await supabaseClient
            .from('reports')
            .insert([{
              wallpaper_id: current.id,
              reason: reason
            }]);

          if (error) throw error;

          reportModal.classList.remove("show");
          showToast("Thank you, your report was sent.");
        } catch (err) {
          console.error("Report error:", err);
          showToast("Failed to send report. Please try again.");
        }
      });
    });

    // =========================================================================
    // 7. INITIALIZE
    // =========================================================================
    renderCategories();
    loadWallpapers();
  </script>
</body>
</html>
